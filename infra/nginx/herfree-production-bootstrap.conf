# Initial Let's Encrypt issuance only (HTTP-01 via webroot).
# Replaced by herfree-production.conf after the certificate exists.
server {
    listen 80;
    server_name api.herpfree.co.kr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
