name: Temporary isolated staging image

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed QA branch commit
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: herfree-member-title-qa-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check isolated candidate identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'jeffyun3061/herfree-platform'
          test "$GITHUB_REF" = 'refs/heads/codex/title-rollback-qa-image'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Confirm AWS account and image repository
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '439777528445'
          test "$ECR_REPOSITORY" = 'herfree-api'
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Build candidate image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${REPOSITORY}:qa-${GITHUB_SHA}"
          docker build --file infra/docker/Dockerfile.backend --tag "$image" .
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push candidate image without promoting it
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: docker push "$IMAGE"


