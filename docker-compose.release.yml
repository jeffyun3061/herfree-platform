services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE is required}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8080}:8080"
    read_only: true
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
        awslogs-stream: herfree-${DEPLOY_ENV:?DEPLOY_ENV is required}
        awslogs-create-group: "false"
