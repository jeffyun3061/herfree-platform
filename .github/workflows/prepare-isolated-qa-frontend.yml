name: Prepare protected QA frontend

on:
  workflow_dispatch:
    inputs:
      source:
        description: Use the existing reviewed candidate or exact current main
        required: true
        type: choice
        options: [candidate, main]
      qa_branch:
        description: Locked QA branch name (required for current main)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'jeffyun3061/herfree-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        if: inputs.source == 'candidate'
      - uses: actions/checkout@v4
        if: inputs.source == 'candidate'
        with:
          ref: aaad889901ab1a085c2d5dbd10d58b47f8edc38f
          path: candidate
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Create protected branch with automatic builds disabled
        if: inputs.source == 'candidate'
        env:
          ISOLATED_QA_BASIC_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          ISOLATED_QA_BASIC_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: >-
          python3 infra/scripts/create-isolated-frontend.py
          --repo candidate
          --candidate-pr 195
          --sha aaad889901ab1a085c2d5dbd10d58b47f8edc38f
          --branch qa-aaad889901ab-aaad8899
      - uses: actions/checkout@v4
        if: inputs.source == 'main'
      - name: Create protected current-main QA frontend
        if: inputs.source == 'main'
        env:
          GH_TOKEN: ${{ secrets.QA_PROTECTION_READ_TOKEN }}
          QA_BRANCH: ${{ inputs.qa_branch }}
          ISOLATED_QA_BASIC_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          ISOLATED_QA_BASIC_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${QA_BRANCH:?A locked QA branch is required}"
          : "${GH_TOKEN:?A branch-protection read credential is required}"
          python3 infra/scripts/create-isolated-frontend.py \
            --repo . --current-main --sha "${GITHUB_SHA}" --branch "${QA_BRANCH}"
