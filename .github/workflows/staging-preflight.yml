name: Staging preflight

on:
  workflow_dispatch:
    inputs:
      qa_branch:
        description: Locked QA frontend branch for this exact PR commit
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'jeffyun3061/herfree-platform' && github.ref == 'refs/heads/codex/reconcile-operations'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    env:
      AWS_REGION: ap-northeast-2
      STAGING_INSTANCE: i-02cf5b8f3a7aa32da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare isolated QA frontend
        env:
          GH_TOKEN: ${{ secrets.QA_PROTECTION_READ_TOKEN }}
          QA_BRANCH: ${{ inputs.qa_branch }}
          ISOLATED_QA_BASIC_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          ISOLATED_QA_BASIC_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?branch protection read token required}"
          [[ "$QA_BRANCH" =~ ^qa-[a-f0-9]{12}-[a-f0-9]{8}$ ]]
          test "${QA_BRANCH:3:12}" = "${GITHUB_SHA:0:12}"
          test "$(gh api repos/jeffyun3061/herfree-platform/pulls/213 --jq .head.sha)" = "$GITHUB_SHA"
          gh api "repos/jeffyun3061/herfree-platform/branches/${QA_BRANCH}/protection" | python3 -c 'import json,sys; sys.path.insert(0,"infra/scripts"); from verify_release_qa_branch import verify_branch_lock; verify_branch_lock(json.load(sys.stdin))'
          errors="$(mktemp)"
          trap 'rm -f "$errors"' EXIT
          if aws amplify get-branch --app-id d2bcg3vnlv5hkh --branch-name "$QA_BRANCH" --query 'branch.branchName' --output text >/dev/null 2>"$errors"; then
            echo 'QA branch already exists; the build verifier will check its configuration.'
          elif grep -q 'NotFoundException' "$errors"; then
            python3 infra/scripts/create-isolated-frontend.py --repo . --candidate-pr 213 --sha "$GITHUB_SHA" --branch "$QA_BRANCH"
          else
            echo 'Cannot determine QA branch state; inspect before retrying.' >&2
            exit 1
          fi
      - name: Build exact isolated QA frontend
        env:
          GH_TOKEN: ${{ secrets.QA_PROTECTION_READ_TOKEN }}
          QA_BRANCH: ${{ inputs.qa_branch }}
        run: |
          set -euo pipefail
          output="$(python3 infra/scripts/build-isolated-frontend.py start --repo . --candidate-pr 213 --sha "$GITHUB_SHA" --branch "$QA_BRANCH")"
          job_id="$(jq -er '.jobId // .existingJobId' <<<"$output")"
          [[ "$job_id" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 120); do
            result="$(python3 infra/scripts/build-isolated-frontend.py inspect --repo . --candidate-pr 213 --sha "$GITHUB_SHA" --branch "$QA_BRANCH" --job-id "$job_id")"
            status="$(jq -er '.status' <<<"$result")"
            case "$status" in
              SUCCEED) jq -e '.buildVerified == true and .promotionAllowed == false' <<<"$result" >/dev/null; exit 0 ;;
              FAILED|CANCELLED) echo 'QA build failed; inspect before retrying.' >&2; exit 1 ;;
              PENDING|PROVISIONING|RUNNING|CANCELLING) sleep 10 ;;
              *) echo 'Unexpected QA build status.' >&2; exit 1 ;;
            esac
          done
          echo 'QA build is still running; inspect before retrying.' >&2
          exit 1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build exact candidate image if absent
        id: image
        env:
          GH_TOKEN: ${{ secrets.QA_PROTECTION_READ_TOKEN }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 439777528445
          test "$(gh api repos/jeffyun3061/herfree-platform/pulls/213 --jq .head.sha)" = "${GITHUB_SHA}"
          test "$(aws ecr describe-repositories --repository-names herfree-api --query 'repositories[0].imageTagMutability' --output text)" = IMMUTABLE
          image="${ECR_REGISTRY}/herfree-api:${GITHUB_SHA}"
          result="$(aws ecr batch-get-image --repository-name herfree-api --image-ids imageTag="${GITHUB_SHA}" --output json)"
          if jq -e '(.images | length) == 1 and (.failures | length) == 0' <<<"${result}" >/dev/null; then
            docker pull "${image}"
            echo 'built=false' >> "$GITHUB_OUTPUT"
          else
            jq -e '(.images | length) == 0 and (.failures | length) == 1 and .failures[0].failureCode == "ImageNotFound"' <<<"${result}" >/dev/null
            docker build --file infra/docker/Dockerfile.backend --tag "${image}" .
            echo 'built=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${image}" >> "$GITHUB_OUTPUT"
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push scanned candidate image
        if: steps.image.outputs.built == 'true'
        env:
          CANDIDATE_TAG: ${{ steps.image.outputs.tag }}
        run: docker push "$CANDIDATE_TAG"
      - name: Resolve candidate digest and check isolation
        id: target
        env:
          GH_TOKEN: ${{ secrets.QA_PROTECTION_READ_TOKEN }}
          QA_BRANCH: ${{ inputs.qa_branch }}
          ISOLATED_QA_BASIC_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          ISOLATED_QA_BASIC_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?branch protection read token required}"
          : "${ISOLATED_QA_BASIC_USERNAME:?QA username required}"
          : "${ISOLATED_QA_BASIC_PASSWORD:?QA password required}"
          digest="$(aws ecr describe-images --repository-name herfree-api --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="439777528445.dkr.ecr.ap-northeast-2.amazonaws.com/herfree-api@${digest}"
          python3 infra/scripts/verify-candidate-release-qa.py --pr 213 --sha "$GITHUB_SHA" --branch "$QA_BRANCH" --image "$image" >/dev/null
          run="$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-8)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
      - name: Start only a stopped staging instance
        id: instance
        run: |
          set -euo pipefail
          test "$(aws ec2 describe-instances --instance-ids "$STAGING_INSTANCE" --query 'Reservations[0].Instances[0].State.Name' --output text)" = stopped
          aws ec2 start-instances --instance-ids "$STAGING_INSTANCE" --output json >/dev/null
          echo 'started=true' >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-running --instance-ids "$STAGING_INSTANCE"
          for attempt in $(seq 1 60); do
            status="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${STAGING_INSTANCE}" --query 'InstanceInformationList[0].PingStatus' --output text)"
            if [[ "$status" == Online ]] && python3 infra/scripts/verify_staging_route.py | jq -e '.stagingRouteVerified == true' >/dev/null; then exit 0; fi
            sleep 10
          done
          echo 'SSM did not become ready; manual inspection required.' >&2
          exit 1
      - name: Test and restore isolated staging
        id: session
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ secrets.QA_PROTECTION_READ_TOKEN }}
          QA_BRANCH: ${{ inputs.qa_branch }}
          QA_IMAGE: ${{ steps.target.outputs.image }}
          QA_RUN: ${{ steps.target.outputs.run }}
          ISOLATED_QA_BASIC_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          ISOLATED_QA_BASIC_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: python3 infra/scripts/run-isolated-release-session.py --candidate-pr 213 --sha "$GITHUB_SHA" --branch "$QA_BRANCH" --image "$QA_IMAGE" --run "$QA_RUN" --repo .
      - name: Stop staging after verified restoration
        id: stop
        if: always() && steps.instance.outputs.started == 'true' && steps.session.outputs.safe_to_stop == 'true'
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 439777528445
          aws ec2 stop-instances --instance-ids "$STAGING_INSTANCE" --output json >/dev/null
          aws ec2 wait instance-stopped --instance-ids "$STAGING_INSTANCE"
      - name: Flag uncertain staging state
        if: always() && steps.instance.outcome != 'skipped' && steps.stop.outcome != 'success'
        run: |
          echo 'Staging may still be running; inspect the SSM command IDs and reconcile before retrying.' >&2
          exit 1
