limit_req_zone $binary_remote_addr zone=herfree_auth:10m rate=10r/m;

# HTTP: ACME renewal + redirect to HTTPS
server {
    listen 80;
    server_name api.herpfree.co.kr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: repo-owned reverse proxy (never modified by certbot)
server {
    listen 443 ssl http2;
    server_name api.herpfree.co.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.herpfree.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.herpfree.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HerfreeProductionSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/api/auth/(login|password-reset/request)$ {
        limit_req zone=herfree_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    location / {
        return 404;
    }
}
