name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Backend build
        working-directory: backend
        run: ./gradlew build --no-daemon
        env:
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      - name: Security hygiene check
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n "logPasswordResetLink\|resetUrl=.*log\|readAllBytes" -- backend/src/main/java
          ! git grep -n "0.0.0.0/0" -- . ':!docs/**' ':!.env.prod.example' ':!.github/**'
          ! git grep -n "change_me_jwt_secret" -- . ':!.env.prod.example' ':!.github/**'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
