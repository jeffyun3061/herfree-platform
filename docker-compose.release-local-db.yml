services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    env_file:
      - ${MYSQL_ENV_FILE:?MYSQL_ENV_FILE is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --require-secure-transport=ON
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-192M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-50}
      - --skip-name-resolve
    volumes:
      - ${MYSQL_DATA_DIR:-/var/lib/herfree/mysql}:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-512m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - herfree-internal
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
        awslogs-stream: herfree-${DEPLOY_ENV:?DEPLOY_ENV is required}-mysql
        awslogs-create-group: "false"

  api:
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - herfree-internal
      - herfree-egress

networks:
  herfree-internal:
    driver: bridge
    internal: true
  herfree-egress:
    driver: bridge
