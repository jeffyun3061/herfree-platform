name: Release backend

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ inputs.target }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-staging:
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify the staging frontend is the same release
        env:
          AMPLIFY_APP_ID: ${{ vars.STAGING_AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: develop
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          : "${AMPLIFY_APP_ID:?STAGING_AMPLIFY_APP_ID is required}"
          git fetch --no-tags origin "${AMPLIFY_BRANCH}"
          frontend_sha="$(git rev-parse "origin/${AMPLIFY_BRANCH}")"
          if ! git diff --quiet "${GITHUB_SHA}" "${frontend_sha}" -- frontend amplify.yml; then
            echo "main and ${AMPLIFY_BRANCH} do not contain the same frontend release."
            exit 1
          fi
          latest_job="$(aws amplify list-jobs \
            --app-id "${AMPLIFY_APP_ID}" \
            --branch-name "${AMPLIFY_BRANCH}" \
            --max-results 1 \
            --output json)"
          jq -e --arg commit "${frontend_sha}" \
            '.jobSummaries[0] | .status == "SUCCEED" and .commitId == $commit' \
            <<<"${latest_job}" >/dev/null
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Build immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --file infra/docker/Dockerfile.backend --tag "${image}" .
          echo "uri=${image}" >> "${GITHUB_OUTPUT}"
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push scanned image
        run: docker push "${{ steps.image.outputs.uri }}"

  deploy-staging:
    if: inputs.target == 'staging'
    needs: build-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy through SSM and wait for health rollback gate
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          IMAGE: ${{ needs.build-staging.outputs.image }}
        run: |
          set -euo pipefail
          registry="${IMAGE%%/*}"
          tar -czf /tmp/herfree-release-bundle.tgz \
            docker-compose.release.yml \
            docker-compose.release-local-db.yml \
            infra/nginx/herfree-staging.conf \
            infra/nginx/herfree-staging-bootstrap.conf \
            infra/scripts/backup-db.sh \
            infra/scripts/deploy-release.sh \
            infra/scripts/install-local-db-ops.sh \
            infra/scripts/migrate-rds-to-local.sh \
            infra/scripts/monitor-local-db.sh \
            infra/scripts/prepare-local-db-env.sh \
            infra/scripts/preflight-rds-local-restore.sh \
            infra/scripts/setup-staging-tls.sh \
            infra/scripts/restore-local-db-drill.sh \
            infra/scripts/render-release-env.sh \
            infra/scripts/validate-release-env.sh
          bundle="$(base64 -w 0 /tmp/herfree-release-bundle.tgz)"
          if (( ${#bundle} >= 80000 )); then
            echo "release bundle is too large for the AWS SSM parameter limit" >&2
            exit 1
          fi
          jq -n --arg bundle "${bundle}" --arg image "${IMAGE}" --arg registry "${registry}" \
            --arg region "${AWS_REGION}" '{commands:[
              "install -d -m 0755 /opt/herfree/infra/scripts",
              ("printf %s " + ($bundle|@sh) + " | base64 -d | tar -xzf - -C /opt/herfree"),
              "chmod 0755 /opt/herfree/infra/scripts/*.sh",
              "/opt/herfree/infra/scripts/render-release-env.sh staging",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("/opt/herfree/infra/scripts/deploy-release.sh staging " + $image)
            ],executionTimeout:["900"]}' > /tmp/ssm-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' --output text)"
          status=""
          terminal="false"
          for _ in {1..240}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Failed|Cancelled|TimedOut)
                terminal="true"
                break
                ;;
            esac
            sleep 5
          done
          if [[ "${terminal}" != "true" ]]; then
            aws ssm cancel-command --command-id "${command_id}" >/dev/null || true
            for _ in {1..120}; do
              status="$(aws ssm get-command-invocation \
                --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
                --query 'Status' --output text 2>/dev/null || true)"
              case "${status}" in
                Success|Failed|Cancelled|TimedOut)
                  terminal="true"
                  break
                  ;;
              esac
              sleep 5
            done
          fi
          test "${terminal}" = "true"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          test "${status}" = "Success"
      - name: Reconcile interrupted staging deployment state
        if: failure()
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          set -euo pipefail
          jq -n '{commands:[
            "set -eu",
            "test ! -s /opt/herfree/.deploy/staging.pending-operation || /opt/herfree/infra/scripts/deploy-release.sh staging pending reconcile"
          ],executionTimeout:["300"]}' > /tmp/reconcile-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --parameters file:///tmp/reconcile-parameters.json \
            --query 'Command.CommandId' --output text)"
          if ! aws ssm wait command-executed \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}"; then
            aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" || true
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${INSTANCE_ID}"

  verify-staging:
    if: inputs.target == 'staging'
    needs: [build-staging, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run staging release smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          E2E_HTTP_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          E2E_HTTP_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: npm run e2e:staging:smoke

  staging-mutation-qa:
    if: inputs.target == 'staging'
    needs: verify-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run staging mutation QA
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          E2E_EXPECTED_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          E2E_ALLOW_MUTATION: 'true'
          E2E_HTTP_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          E2E_HTTP_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: npm run e2e:staging:mutation

  promote-staging-image:
    if: inputs.target == 'staging'
    needs: [build-staging, staging-mutation-qa]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mark the exact image as staging-tested
        run: |
          set -euo pipefail
          manifest="$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${GITHUB_SHA}" --query 'images[0].imageManifest' --output text)"
          test -n "${manifest}" && test "${manifest}" != "None"
          aws ecr put-image --repository-name "${ECR_REPOSITORY}" --image-tag "staging-passed-${GITHUB_SHA}" --image-manifest "${manifest}"

  build-production:
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      image_digest: ${{ steps.release.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the current main commit
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Build immutable production candidate
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          tag="production-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          docker build --file infra/docker/Dockerfile.backend --tag "${image}" .
          echo "uri=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push scanned image
        run: docker push "${{ steps.image.outputs.uri }}"
      - id: release
        name: Resolve immutable image digest
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "commit_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"

  deploy-production:
    if: inputs.target == 'production'
    needs: build-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-production.outputs.commit_sha }}
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Validate scanned image and deploy with rollback
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
          IMAGE_DIGEST: ${{ needs.build-production.outputs.image_digest }}
          RELEASE_SHA: ${{ needs.build-production.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --query 'repositories[0].imageTagMutability' --output text)" = "IMMUTABLE"
          aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageDigest="${IMAGE_DIGEST}" >/dev/null
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          tar -czf /tmp/herfree-release-bundle.tgz \
            docker-compose.release.yml \
            docker-compose.release-local-db.yml \
            infra/nginx/herfree-production.conf \
            infra/nginx/herfree-production-bootstrap.conf \
            infra/scripts/backup-db.sh \
            infra/scripts/deploy-release.sh \
            infra/scripts/install-local-db-ops.sh \
            infra/scripts/migrate-rds-to-local.sh \
            infra/scripts/monitor-local-db.sh \
            infra/scripts/prepare-local-db-env.sh \
            infra/scripts/preflight-rds-local-restore.sh \
            infra/scripts/restore-local-db-drill.sh \
            infra/scripts/setup-production-tls.sh \
            infra/scripts/render-release-env.sh \
            infra/scripts/validate-release-env.sh
          bundle="$(base64 -w 0 /tmp/herfree-release-bundle.tgz)"
          if (( ${#bundle} >= 80000 )); then
            echo "release bundle is too large for the AWS SSM parameter limit" >&2
            exit 1
          fi
          jq -n --arg bundle "${bundle}" --arg image "${image}" --arg registry "${ECR_REGISTRY}" \
            --arg region "${AWS_REGION}" '{commands:[
              "install -d -m 0755 /opt/herfree/infra/scripts",
              ("printf %s " + ($bundle|@sh) + " | base64 -d | tar -xzf - -C /opt/herfree"),
              "chmod 0755 /opt/herfree/infra/scripts/*.sh",
              "/opt/herfree/infra/scripts/render-release-env.sh production",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("/opt/herfree/infra/scripts/deploy-release.sh production " + $image)
            ],executionTimeout:["900"]}' > /tmp/ssm-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' --output text)"
          status=""
          terminal="false"
          for _ in {1..240}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Failed|Cancelled|TimedOut)
                terminal="true"
                break
                ;;
            esac
            sleep 5
          done
          if [[ "${terminal}" != "true" ]]; then
            aws ssm cancel-command --command-id "${command_id}" >/dev/null || true
            for _ in {1..120}; do
              status="$(aws ssm get-command-invocation \
                --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
                --query 'Status' --output text 2>/dev/null || true)"
              case "${status}" in
                Success|Failed|Cancelled|TimedOut)
                  terminal="true"
                  break
                  ;;
              esac
              sleep 5
            done
          fi
          test "${terminal}" = "true"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          test "${status}" = "Success"
      - name: Reconcile interrupted production deployment state
        if: failure()
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
        run: |
          set -euo pipefail
          jq -n '{commands:[
            "set -eu",
            "test ! -s /opt/herfree/.deploy/production.pending-operation || /opt/herfree/infra/scripts/deploy-release.sh production pending reconcile"
          ],executionTimeout:["300"]}' > /tmp/reconcile-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --parameters file:///tmp/reconcile-parameters.json \
            --query 'Command.CommandId' --output text)"
          if ! aws ssm wait command-executed \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}"; then
            aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" || true
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${INSTANCE_ID}"

  production-smoke:
    if: inputs.target == 'production'
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - id: smoke
        name: Public health and security smoke
        continue-on-error: true
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          : "${API_URL:?PRODUCTION_API_URL is required}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 20 \
            --dump-header /tmp/health-headers \
            --output /tmp/health.json \
            "${API_URL}/api/health"
          grep -qi '^x-request-id:' /tmp/health-headers
          jq -e '.success == true and .data.status == "UP" and .data.environment == "prod"' /tmp/health.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 20 \
            --dump-header /tmp/journal-headers \
            --output /tmp/journal-home-stats.json \
            "${API_URL}/api/journal/public/home-stats"
          grep -qi '^cache-control:.*no-store' /tmp/journal-headers
          jq -e '.success == true and (.data | type == "object") and (.data == {})' /tmp/journal-home-stats.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/swagger-ui.html")" = "404"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/api/admin/reports")"
          test "${code}" = "401" || test "${code}" = "403"
      - name: Configure AWS credentials for automatic rollback
        if: steps.smoke.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll back failed production smoke through SSM
        if: steps.smoke.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
        run: |
          set -euo pipefail
          jq -n '{commands:[
            "set -eu",
            "previous_image=$(cat /opt/herfree/.deploy/production.previous-image)",
            "test -n \"${previous_image}\"",
            "/opt/herfree/infra/scripts/deploy-release.sh production \"${previous_image}\" rollback"
          ],executionTimeout:["900"]}' > /tmp/rollback-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters file:///tmp/rollback-parameters.json \
            --query 'Command.CommandId' --output text)"
          status=""
          terminal="false"
          for _ in {1..240}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Failed|Cancelled|TimedOut)
                terminal="true"
                break
                ;;
            esac
            sleep 5
          done
          if [[ "${terminal}" != "true" ]]; then
            aws ssm cancel-command --command-id "${command_id}" >/dev/null || true
            for _ in {1..120}; do
              status="$(aws ssm get-command-invocation \
                --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
                --query 'Status' --output text 2>/dev/null || true)"
              case "${status}" in
                Success|Failed|Cancelled|TimedOut)
                  terminal="true"
                  break
                  ;;
              esac
              sleep 5
            done
          fi
          test "${terminal}" = "true"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          test "${status}" = "Success"
      - name: Reconcile interrupted production rollback state
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
        run: |
          set -euo pipefail
          jq -n '{commands:[
            "set -eu",
            "test ! -s /opt/herfree/.deploy/production.pending-operation || /opt/herfree/infra/scripts/deploy-release.sh production pending reconcile"
          ],executionTimeout:["300"]}' > /tmp/reconcile-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --parameters file:///tmp/reconcile-parameters.json \
            --query 'Command.CommandId' --output text)"
          if ! aws ssm wait command-executed \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}"; then
            aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" || true
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
      - name: Verify the rolled-back service externally
        if: steps.smoke.outcome == 'failure'
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 20 \
            --dump-header /tmp/rollback-health-headers \
            --output /tmp/rollback-health.json \
            "${API_URL}/api/health"
          grep -qi '^x-request-id:' /tmp/rollback-health-headers
          jq -e '
            .success == true
            and .data.status == "UP"
            and ((.data.environment // "prod") == "prod")
          ' /tmp/rollback-health.json
      - name: Fail the release after automatic rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Production smoke failed. The previous image was restored and verified."
          exit 1
