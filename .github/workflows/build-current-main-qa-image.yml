name: Build current-main QA image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jeffyun3061/herfree-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: herfree-api
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Build or reuse immutable image for the exact current main
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          test "${ECR_REGISTRY}" = '439777528445.dkr.ecr.ap-northeast-2.amazonaws.com'
          test "${GITHUB_SHA}" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$(aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" \
            --query 'repositories[0].imageTagMutability' --output text)" = IMMUTABLE
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          existing="$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" --output json)"
          if jq -e '(.images | length) == 1 and (.failures | length) == 0' <<<"${existing}" >/dev/null; then
            docker pull "${image}"
            echo 'source=existing' >> "${GITHUB_OUTPUT}"
          elif jq -e '(.images | length) == 0 and (.failures | length) == 1 and .failures[0].failureCode == "ImageNotFound"' <<<"${existing}" >/dev/null; then
            docker build --file infra/docker/Dockerfile.backend --tag "${image}" .
            echo 'source=built' >> "${GITHUB_OUTPUT}"
          else
            echo 'Unexpected ECR response; refusing to overwrite a release tag.' >&2
            exit 1
          fi
          echo "uri=${image}" >> "${GITHUB_OUTPUT}"
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push scanned QA image without promoting it
        if: steps.image.outputs.source == 'built'
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          docker push '${{ steps.image.outputs.uri }}'
