limit_req_zone $binary_remote_addr zone=herfree_staging_auth:10m rate=120r/m;

server {
    listen 80;
    server_name api-staging.herpfree.co.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-staging.herpfree.co.kr;

    ssl_certificate /etc/letsencrypt/live/api-staging.herpfree.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.herpfree.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/api/auth/(login|password-reset/request)$ {
        limit_req zone=herfree_staging_auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }

    location / {
        return 404;
    }
}
