name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate release shell scripts
        run: |
          set -euo pipefail
          bash -n infra/scripts/*.sh
          grep -q 'DB_RUNTIME=' infra/scripts/render-release-env.sh
          grep -q 'sslMode=REQUIRED' infra/scripts/render-release-env.sh
          grep -q 'internal: true' docker-compose.release-local-db.yml
          ! grep -A8 '^  mysql:' docker-compose.release-local-db.yml | grep -q 'ports:'
          grep -q 'CONFIRM_RDS_TO_LOCAL_MIGRATION.*YES' infra/scripts/migrate-rds-to-local.sh
          grep -q 'row-count verification failed' infra/scripts/migrate-rds-to-local.sh
          grep -q -- '--sse AES256' infra/scripts/backup-db.sh
          grep -q 'sha256sum -c' infra/scripts/restore-local-db-drill.sh
          grep -q 'DatabaseBackupAgeHours' infra/scripts/monitor-local-db.sh
          grep -q 'sslMode=VERIFY_IDENTITY' .env.staging.example
          grep -q 'sslMode=VERIFY_IDENTITY' .env.prod.example
          grep -q 'ADMIN_BOOTSTRAP_ENABLED=false' .env.staging.example
          grep -q 'ADMIN_BOOTSTRAP_ENABLED=false' .env.prod.example
          grep -q 'HEALTH_DATA_ENCRYPTION_KEY=' .env.staging.example
          grep -q 'HEALTH_DATA_ENCRYPTION_KEY=' .env.prod.example
          ! grep -q 'herfree/staging/app-config' scripts/setup-production-aws.ps1
          ! grep -q 'herfree/staging/db-app' scripts/setup-production-aws.ps1
          ! grep -q 'herfree/staging/smtp' scripts/setup-production-aws.ps1
          grep -q 'build-production:' .github/workflows/release-backend.yml
          grep -q 'backup-db.sh' .github/workflows/release-backend.yml
          grep -q 'deploy-release.sh.*rollback' infra/scripts/rollback-release.sh
          grep -q 'put-bucket-encryption' scripts/setup-production-aws.ps1
          grep -q 'put-public-access-block' scripts/setup-production-aws.ps1
          grep -q 'put-retention-policy' scripts/setup-production-aws.ps1
          grep -q 'CONFIRM_RESTORE_DRILL.*YES' infra/scripts/restore-rds-drill.sh
          grep -q -- '--no-publicly-accessible' infra/scripts/restore-rds-drill.sh
          grep -q 'delete-db-instance' infra/scripts/restore-rds-drill.sh
          grep -q 'static S3 credentials' infra/scripts/validate-release-env.sh
          grep -q 'HEALTH_DATA_REKEY_ON_STARTUP' infra/scripts/validate-release-env.sh
          grep -q 'ADMIN_ACCESS_ALLOWED_CIDRS' infra/scripts/validate-release-env.sh
          grep -q 'AdminAccessGateFilter' backend/src/main/java/com/herfree/global/security/SecurityConfig.java

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reject committed secrets
        run: node scripts/check-secrets.mjs --tracked
      - name: Reject sensitive logger arguments
        run: node scripts/check-sensitive-logging.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Backend test
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon
        env:
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      - name: Backend build
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
        env:
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      - name: Security hygiene check
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n "logPasswordResetLink\|resetUrl=.*log\|readAllBytes" -- backend/src/main/java
          # Test fixtures and release validators intentionally mention rejected
          # values. Scan shipped application/runtime source only; the dedicated
          # secret and release-env checks cover fixtures and deployment scripts.
          ! git grep -n "0.0.0.0/0" -- backend/src/main/java infra/nginx docker-compose.release.yml
          ! git grep -n "change_me_jwt_secret" -- backend/src/main

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_OAUTH_REDIRECT_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_OAUTH_REQUIRED_PROVIDERS: kakao,google,naver
          NEXT_PUBLIC_OAUTH_KAKAO_CLIENT_ID: ci-kakao-client-id
          NEXT_PUBLIC_OAUTH_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
          NEXT_PUBLIC_OAUTH_NAVER_CLIENT_ID: ci-naver-client-id
        run: |
          # Keep the explicit audit gates below authoritative; do not let npm's
          # implicit audit call make CI depend on a transient registry response.
          npm ci --no-audit
          # Shipped dependencies block on high/critical findings. Development
          # tooling also blocks on critical findings; see ADR-025.
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
          npm run check:security-headers
          npm run lint
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --grep "signup validation"
