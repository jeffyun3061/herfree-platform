version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Amplify console env vars are build-time only unless written for Next.js SSR.
            # See https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
            - env | grep -e API_REWRITE_TARGET >> .env.production || true
            - env | grep -e NEXT_PUBLIC_ >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
    appRoot: frontend
