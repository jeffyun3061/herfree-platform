name: Release backend

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Production only - staging-passed-<commit SHA>
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ inputs.target }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-staging:
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Build immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --file infra/docker/Dockerfile.backend --tag "${image}" .
          echo "uri=${image}" >> "${GITHUB_OUTPUT}"
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push scanned image
        run: docker push "${{ steps.image.outputs.uri }}"

  deploy-staging:
    if: inputs.target == 'staging'
    needs: build-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy through SSM and wait for health rollback gate
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          IMAGE: ${{ needs.build-staging.outputs.image }}
        run: |
          set -euo pipefail
          registry="${IMAGE%%/*}"
          tar -czf /tmp/herfree-release-bundle.tgz \
            docker-compose.release.yml \
            infra/scripts/deploy-release.sh \
            infra/scripts/render-release-env.sh \
            infra/scripts/validate-release-env.sh
          bundle="$(base64 -w 0 /tmp/herfree-release-bundle.tgz)"
          jq -n --arg bundle "${bundle}" --arg image "${IMAGE}" --arg registry "${registry}" \
            --arg region "${AWS_REGION}" '{commands:[
              "install -d -m 0755 /opt/herfree/infra/scripts",
              ("printf %s " + ($bundle|@sh) + " | base64 -d | tar -xzf - -C /opt/herfree"),
              "chmod 0755 /opt/herfree/infra/scripts/*.sh",
              "/opt/herfree/infra/scripts/render-release-env.sh staging",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("/opt/herfree/infra/scripts/deploy-release.sh staging " + $image)
            ]}' > /tmp/ssm-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' --output text)"
          status=""
          for _ in {1..120}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          test "${status}" = "Success"

  verify-staging:
    if: inputs.target == 'staging'
    needs: [build-staging, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run staging release smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          E2E_HTTP_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          E2E_HTTP_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: npm run e2e:staging:smoke
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mark the exact image as staging-tested
        run: |
          set -euo pipefail
          manifest="$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${GITHUB_SHA}" --query 'images[0].imageManifest' --output text)"
          test -n "${manifest}" && test "${manifest}" != "None"
          aws ecr put-image --repository-name "${ECR_REPOSITORY}" --image-tag "staging-passed-${GITHUB_SHA}" --image-manifest "${manifest}"

  staging-mutation-qa:
    if: inputs.target == 'staging'
    needs: verify-staging
    runs-on: ubuntu-latest
    environment: staging
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run staging mutation QA (non-blocking)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          E2E_ALLOW_MUTATION: 'true'
          E2E_HTTP_USERNAME: ${{ secrets.E2E_HTTP_USERNAME }}
          E2E_HTTP_PASSWORD: ${{ secrets.E2E_HTTP_PASSWORD }}
        run: npm run e2e:staging:mutation

  deploy-production:
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Validate promoted image and deploy with rollback
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_TAG}" =~ ^staging-passed-[0-9a-f]{40}$ ]]; then
            echo "Production requires staging-passed-<40 character commit SHA>."
            exit 2
          fi
          aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" >/dev/null
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",\"/opt/herfree/infra/scripts/deploy-release.sh production ${image}\"]" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"

  production-smoke:
    if: inputs.target == 'production'
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Public health and security smoke
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${API_URL}/api/health"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/swagger-ui.html")" = "404"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/api/admin/reports")"
          test "${code}" = "401" || test "${code}" = "403"
