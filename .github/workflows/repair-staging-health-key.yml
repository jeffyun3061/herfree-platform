name: Repair staging health data key

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Rotate invalid staging health data key
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          secret_id='herfree/staging/app-config'
          current="$(aws secretsmanager get-secret-value \
            --region "${AWS_REGION}" --secret-id "${secret_id}" \
            --query SecretString --output text)"
          key="$(jq -r '.healthDataEncryptionKey // empty' <<<"${current}")"
          valid='false'
          if [[ "${key}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            valid='true'
          else
            decoded_bytes="$(printf '%s' "${key}" | base64 -d 2>/dev/null | wc -c | tr -d ' ')"
            if [[ "${decoded_bytes}" == '32' ]]; then
              valid='true'
            fi
          fi
          if [[ "${valid}" == 'true' ]]; then
            echo 'staging health data key is already valid; no change made'
            exit 0
          fi
          new_key="$(openssl rand -base64 32)"
          updated="$(jq -c --arg key "${new_key}" '.healthDataEncryptionKey = $key' <<<"${current}")"
          aws secretsmanager put-secret-value \
            --region "${AWS_REGION}" --secret-id "${secret_id}" \
            --secret-string "${updated}" >/dev/null
          echo 'staging health data key rotated without printing the secret'
