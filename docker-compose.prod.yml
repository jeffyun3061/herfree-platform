# LEGACY / REFERENCE ONLY — do not use for health-data staging or production.
# This file runs API + Docker MySQL without the RDS certificate verification path.
# Production uses docker-compose.release.yml + private RDS + Secrets Manager.
# Use docker-compose.local.yml for local development.
services:
  mysql:
    image: mysql:8.4.10
    container_name: herfree-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-herfree_db}
      MYSQL_USER: ${MYSQL_USER:-herfree_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - herfree_mysql_prod_data:/var/lib/mysql
      - ./infra/scripts/backup:/backup
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-herfree_user}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - herfree-internal

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: herfree-api-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-herfree_db}?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-herfree_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ANALYTICS_HASH_SALT: ${ANALYTICS_HASH_SALT}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      S3_BUCKET: ${S3_BUCKET:-${AWS_S3_BUCKET:-}}
      S3_REGION: ${S3_REGION:-${AWS_REGION:-ap-northeast-2}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      ADMIN_BOOTSTRAP_ENABLED: "false"
      APP_MAIL_MODE: ${APP_MAIL_MODE:-smtp}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-herpfree3@gmail.com}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      PASSWORD_RESET_FRONTEND_BASE_URL: ${PASSWORD_RESET_FRONTEND_BASE_URL:-}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-}
      OAUTH_KAKAO_REDIRECT_URI: ${OAUTH_KAKAO_REDIRECT_URI:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-}
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-}
      OAUTH_NAVER_REDIRECT_URI: ${OAUTH_NAVER_REDIRECT_URI:-}
    ports:
      # Nginx(호스트 또는 별도 컨테이너)가 127.0.0.1:8080 으로 프록시한다
      - "127.0.0.1:8080:8080"
    networks:
      - herfree-internal

volumes:
  herfree_mysql_prod_data:

networks:
  herfree-internal:
    driver: bridge
