name: Deploy production frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AMPLIFY_APP_ID: d2bcg3vnlv5hkh
      AMPLIFY_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - name: Verify production legal and privacy facts
        shell: pwsh
        env:
          LEGAL_OPERATOR_CONFIRMED: ${{ secrets.LEGAL_OPERATOR_CONFIRMED }}
          PRIVACY_CONTACT_CONFIRMED: ${{ secrets.PRIVACY_CONTACT_CONFIRMED }}
          LEGAL_MAIL_PROVIDER: ${{ secrets.LEGAL_MAIL_PROVIDER }}
          LEGAL_MAIL_PROVIDER_COUNTRY: ${{ secrets.LEGAL_MAIL_PROVIDER_COUNTRY }}
          LEGAL_AWS_REGION: ${{ secrets.LEGAL_AWS_REGION }}
          LEGAL_AWS_CROSS_BORDER_ACCESS_REVIEWED: ${{ secrets.LEGAL_AWS_CROSS_BORDER_ACCESS_REVIEWED }}
          LEGAL_POLICY_REVIEWED_VERSION: ${{ secrets.LEGAL_POLICY_REVIEWED_VERSION }}
          LEGAL_OPERATIONAL_REVIEW_REFERENCE: ${{ secrets.LEGAL_OPERATIONAL_REVIEW_REFERENCE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTHOG_POLICY_APPROVED: ${{ secrets.POSTHOG_POLICY_APPROVED }}
        run: ./scripts/verify-legal-policy-alignment.ps1 -StrictOperationalFacts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy current main to Amplify
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "${GITHUB_SHA}" = "${current_main}"

          python3 infra/scripts/release-amplify.py \
            --app "${AMPLIFY_APP_ID}" --branch "${AMPLIFY_BRANCH}" --sha "${GITHUB_SHA}"
      - name: Check public frontend
        run: curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --output /dev/null https://www.herpfree.co.kr/community
